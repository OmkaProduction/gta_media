name: Clips

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (saves Actions minutes); picks up VODs that finished since the last run
  workflow_dispatch:
    inputs:
      streamer:
        description: "Streamer id from config/streamers.yaml (empty = all enabled)"
        required: false
      vod_url:
        description: "Process this one VOD URL (needs streamer)"
        required: false
      max_vods:
        description: "VODs per streamer"
        required: false
        default: "1"

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Make clips
        env:
          PYTHONUNBUFFERED: "1"   # show progress in the live log
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STREAMER: ${{ inputs.streamer }}
          VOD_URL: ${{ inputs.vod_url }}
          MAX_VODS: ${{ inputs.max_vods || '1' }}
        run: |
          args=(--max-vods "$MAX_VODS")
          if [ -n "$STREAMER" ]; then args+=(--streamer "$STREAMER"); fi
          if [ -n "$VOD_URL" ]; then args+=(--vod-url "$VOD_URL"); fi
          python -m clipper "${args[@]}"

      - name: Upload clips for review
        if: always() && hashFiles('out/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: out/
          retention-days: 14

      - name: Remember processed VODs
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update processed VODs"
            git pull --rebase -q
            git push
          fi
