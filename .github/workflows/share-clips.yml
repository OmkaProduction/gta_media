name: Share clips

# Copies the clips of a finished "Clips" run from its artifact to the `clips` branch
# (folder run-<run id>/), so they can be fetched with plain git and shared outside GitHub.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a finished Clips run"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: share-clips
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifact


      - name: Push to the clips branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/push_clips.sh artifact "run-${{ inputs.run_id }}"
