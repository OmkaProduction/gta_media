name: Peek VODs

# Lists the latest VOD titles of the given channels (e.g. to see who streams GTA 6).
on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Space-separated platform:channel, e.g. twitch:ewroon kick:nitro"
        required: true

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q PyYAML "yt-dlp[default,curl-cffi]>=2026.10.26"
      - env:
          CHANNELS: ${{ inputs.channels }}
        run: python scripts/peek_vods.py $CHANNELS
