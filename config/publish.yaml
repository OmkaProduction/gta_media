# Automatic publishing through Buffer (https://developers.buffer.com).
# Each run's clips are pushed to the `clips` branch; Buffer downloads them from base_url when it publishes.
# Needs the repo secret BUFFER_API_KEY. Nothing is posted while `enabled` is false or `channels` is empty.

buffer:
  enabled: false
  # direct public file URLs: the repo must be public for raw.githubusercontent.com links to work
  base_url: https://raw.githubusercontent.com/OmkaProduction/gta_media/clips
  mode: addToQueue          # posts go to each channel's queue slots set in Buffer
  channels: []
  # - id: 0123456789abcdef01234567   # Buffer channel id
  #   service: youtube               # youtube | tiktok | instagram | facebook
  #   streamers: [dom, lacy, clix]   # optional: only these streamers' clips (default: all)
